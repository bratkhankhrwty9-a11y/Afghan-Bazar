
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>افغان بازار</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3eb;color:#17264b;font-family:Arial,sans-serif}
header{background:#102b60;color:white;text-align:center;padding:20px;font-size:25px;font-weight:bold}
main{max-width:850px;margin:auto;padding:15px}
section{background:white;padding:15px;border-radius:14px;margin:15px 0}
h2{color:#102b60}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
button,.btn{border:0;border-radius:9px;padding:11px 15px;margin:4px;background:#e99a20;color:white;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.green{background:#168b50}
.red{background:#b83232}
.blue{background:#102b60}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.cat{background:#f0f3f8;color:#102b60;font-weight:bold}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.card img{width:100%;max-height:260px;object-fit:contain;border-radius:10px}
.muted{color:#777;font-size:13px}
.hidden{display:none}
footer{text-align:center;padding:20px;background:white}
</style>
</head>
<body>

<header>🇦🇫 افغان بازار</header>

<main>
<section>
<h2>📂 د اعلانونو کټګورۍ</h2>
<div class="grid" id="categories"></div>
</section>

<section>
<h2>🔎 اعلانونه ولټوئ</h2>
<input id="search" placeholder="د اعلان نوم یا ولایت ولیکئ" oninput="showAds()">
<select id="filter" onchange="showAds()">
<option value="">ټولې کټګورۍ</option>
</select>
</section>

<section>
<h2>🏷️ اعلانونه</h2>
<div id="ads"></div>
</section>

<section>
<h2>🔐 د مدیر برخه</h2>
<button class="blue" onclick="login()">د مدیر ننوتل</button>
<div id="admin" class="hidden">
<h3>نوی اعلان زیاتول</h3>
<input id="title" placeholder="د اعلان نوم">
<select id="category"></select>
<input id="price" placeholder="قیمت په افغانۍ">
<input id="city" placeholder="ولایت">
<textarea id="details" placeholder="د اعلان معلومات"></textarea>
<label>د اعلان عکس وټاکئ:</label>
<input id="photo" type="file" accept="image/*">
<button class="green" onclick="addAd()">اعلان خپرول</button>
<hr>
<h3>د اعلانونو اداره</h3>
<div id="manage"></div>
<button class="red" onclick="logout()">وتل</button>
</div>
</section>

<footer>
<h3>📞 له افغان بازار سره اړیکه</h3>
<a class="btn green" href="https://wa.me/93706022306">WhatsApp اړیکه</a>
<a class="btn blue" href="https://www.facebook.com/profile.php?id=61587252753972">Facebook</a>
<p>+93 706 022 306</p>
</footer>
</main>

<script>
const names=[
"موټرونه","کورونه او ځمکې","کرنه او زراعتي وسایل",
"موبایلونه","دوکانونه او سوداګري","څاروي او مالداري",
"کورني وسایل","کالي او بوټان","نور"
];

let ads=[];
let isAdmin=false;

try{
ads=JSON.parse(localStorage.getItem("afghanMarketAds")||"[]");
}catch(e){ads=[];}

function save(){
localStorage.setItem("afghanMarketAds",JSON.stringify(ads));
}

function setup(){
const c=document.getElementById("categories");
const f=document.getElementById("filter");
const a=document.getElementById("category");

names.forEach(n=>{
let b=document.createElement("button");
b.className="cat";
b.textContent=n;
b.onclick=()=>{
f.value=n;
showAds();
document.getElementById("ads").scrollIntoView();
};
c.appendChild(b);
f.add(new Option(n,n));
a.add(new Option(n,n));
});
}
function login(){
let p=prompt("د مدیر PIN ولیکئ:");
if(p==="2468"){
isAdmin=true;
document.getElementById("admin").classList.remove("hidden");
renderManage();
}else{
alert("PIN ناسم دی");
}
}
function logout(){
isAdmin=false;
document.getElementById("admin").classList.add("hidden");
}
function addAd(){
if(!isAdmin)return;
let title=document.getElementById("title").value.trim();
let category=document.getElementById("category").value;
let price=document.getElementById("price").value.trim();
let city=document.getElementById("city").value.trim();
let details=document.getElementById("details").value.trim();
let file=document.getElementById("photo").files[0];

if(!title||!category||!price||!city||!file){
alert("نوم، کټګوري، قیمت، ولایت او عکس بشپړ کړئ.");
return;
}
if(file.size>1500000){
alert("عکس ډېر لوی دی. مهرباني وکړئ کوچنی عکس وټاکئ.");
return;
}
let reader=new FileReader();
reader.onload=function(){
ads.unshift({
id:Date.now().toString(),
title,category,price,city,details,
image:reader.result,
views:0,
likes:0
});
try{
save();
document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("details").value="";
document.getElementById("photo").value="";
showAds();
renderManage();
alert("اعلان په بریالیتوب خپور شو.");
}catch(e){
alert("د موبایل د زېرمه کولو ځای ډک دی. کوچنی عکس وکاروئ.");
}
};
reader.onerror=()=>alert("عکس لوستل کېدای نه شول.");
reader.readAsDataURL(file);
}
function showAds(){
let box=document.getElementById("ads");
let q=document.getElementById("search").value.trim().toLowerCase();
let f=document.getElementById("filter").value;
box.innerHTML="";
let list=ads.filter(a=>
(!f||a.category===f)&&
((a.title+" "+a.city+" "+a.details).toLowerCase().includes(q))
);
if(!list.length){
box.innerHTML="<p>اوس مهال اعلان نشته.</p>";
return;
}
list.forEach(a=>{
let d=document.createElement("div");
d.className="card";
let h=document.createElement("h3");
h.textContent=a.title;
d.appendChild(h);
if(a.image){
let img=document.createElement("img");
img.src=a.image;
img.alt=a.title;
d.appendChild(img);
}
let p=document.createElement("p");
p.textContent="کټګوري: "+a.category+" | قیمت: "+a.price+" افغانۍ | ولایت: "+a.city;
d.appendChild(p);
let detail=document.createElement("p");
detail.textContent=a.details;
d.appendChild(detail);
let stats=document.createElement("p");
stats.className="muted";
stats.textContent="👁 "+(a.views||0)+" لیدنې  ❤️ "+(a.likes||0)+" خوښې";
d.appendChild(stats);
let like=document.createElement("button");
like.textContent="❤️ خوښول";
like.onclick=()=>{a.likes=(a.likes||0)+1;save();showAds();};
d.appendChild(like);
let contact=document.createElement("a");
contact.className="btn green";
contact.href="https://wa.me/93706022306";
contact.textContent="له مدیر سره اړیکه";
d.appendChild(contact);
box.appendChild(d);
});
}
function renderManage(){
if(!isAdmin)return;
let box=document.getElementById("manage");
box.innerHTML="";
ads.forEach(a=>{
let d=document.createElement("div");
d.className="card";
let t=document.createElement("b");
t.textContent=a.title;
d.appendChild(t);
let del=document.createElement("button");
del.className="red";
del.textContent="ړنګول";
del.onclick=()=>{
if(confirm("دا اعلان ړنګ کړئ؟")){
ads=ads.filter(x=>x.id!==a.id);
save();showAds();renderManage();
}
};
d.appendChild(del);
box.appendChild(d);
});
}
setup();
showAds();
</script>
</body>
</html>
