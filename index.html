<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>افغان بازار</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3eb;color:#17264b;font-family:Arial,sans-serif}
header{background:#102b60;color:white;text-align:center;padding:22px;font-size:26px;font-weight:bold}
main{max-width:850px;margin:auto;padding:12px}
section{background:white;padding:15px;border-radius:13px;margin:13px 0}
h2{color:#102b60;font-size:20px}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
button,.btn{border:0;border-radius:9px;padding:11px 14px;margin:4px;background:#e99a20;color:white;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.blue{background:#102b60}
.green{background:#168b50}
.red{background:#b83232}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat{background:#edf1f7;color:#102b60;font-weight:bold}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.card img,.card video{width:100%;max-height:280px;object-fit:contain;border-radius:9px}
.muted{color:#777;font-size:13px}
.hidden{display:none}
footer{text-align:center;padding:20px;background:white}
</style>
</head>
<body>

<header>افغان بازار</header>

<main>

<section>
<h2>د اعلانونو کټګورۍ</h2>
<div id="categories" class="grid"></div>
</section>

<section>
<h2>د اعلانونو لټون</h2>
<input id="search" placeholder="د اعلان نوم یا ولایت ولیکئ">
<select id="filter">
<option value="">ټولې کټګورۍ</option>
</select>
</section>

<section>
<h2>اعلانونه</h2>
<div id="ads">اعلانونه نشته.</div>
</section>

<section>
<h2>د مدیر برخه</h2>
<button class="blue" onclick="login()">مدیر ته ننوتل</button>

<div id="admin" class="hidden">
<h3>نوی اعلان</h3>

<input id="title" placeholder="د اعلان نوم">

<select id="category"></select>

<input id="price" placeholder="قیمت په افغانۍ">

<select id="city">
<option value="">ولایت انتخاب کړئ</option>
<option>هلمند</option><option>کابل</option>
<option>کندهار</option><option>هرات</option>
<option>ننګرهار</option><option>بلخ</option>
<option>فراه</option><option>نیمروز</option>
<option>غزني</option><option>پکتیا</option>
<option>پکتیکا</option><option>خوست</option>
<option>لوګر</option><option>وردګ</option>
<option>زابل</option><option>ارزګان</option>
<option>دایکندي</option><option>بامیان</option>
<option>پروان</option><option>کاپیسا</option>
<option>پنجشېر</option><option>لغمان</option>
<option>کنړ</option><option>نورستان</option>
<option>بدخشان</option><option>تخار</option>
<option>کندز</option><option>بغلان</option>
<option>سمنګان</option><option>جوزجان</option>
<option>سرپل</option><option>فاریاب</option>
<option>بادغیس</option><option>غور</option>
</select>

<textarea id="details" placeholder="د اعلان معلومات"></textarea>

<label>عکس یا ویډیو انتخاب کړئ</label>
<input id="media" type="file" accept="image/*,video/*">

<select id="duration">
<option value="1">۱ ساعت</option>
<option value="24">۲۴ ساعته</option>
<option value="120">۵ ورځې</option>
<option value="720">یوه میاشت</option>
</select>

<label>
<input type="checkbox" id="repeat" style="width:auto">
اعلان په تکراري ډول ښکاره شي
</label>

<button class="green" onclick="addAd()">اعلان خپرول</button>

<hr>
<h3>د اعلانونو اداره</h3>
<div id="manage"></div>

<hr>
<h3>احصایې</h3>
<div id="stats"></div>

<button class="red" onclick="logout()">وتل</button>
</div>
</section>

<footer>
<h3>له افغان بازار سره اړیکه</h3>
<a class="btn green" href="https://wa.me/93706022306">WhatsApp</a>
<a class="btn blue" href="https://www.facebook.com/profile.php?id=61587252753972">Facebook</a>
<p>مدیر: برات خان</p>
<p>+93 706 022 306</p>
</footer>

</main>

<script>
const categories=[
"موټرونه","کورونه او ځمکې","کرنه او زراعتي وسایل",
"موبایلونه","دوکانونه او سوداګري","څاروي او مالداري",
"کورني وسایل","کالي او بوټان","نور"
];

let ads=[];
let admin=false;
let editing=null;

const $=id=>document.getElementById(id);

function load(){
try{
ads=JSON.parse(localStorage.getItem("afghanMarketAds")||"[]");
}catch(e){ads=[]}
}

function save(){
localStorage.setItem("afghanMarketAds",JSON.stringify(ads));
}

function setup(){
categories.forEach(c=>{
$("categories").innerHTML+=
`<button class="cat" onclick="chooseCategory('${c}')">${c}</button>`;
$("category").add(new Option(c,c));
$("filter").add(new Option(c,c));
});
}

function chooseCategory(c){
$("filter").value=c;
showAds();
$("ads").scrollIntoView({behavior:"smooth"});
}

function login(){
let pin=prompt("د مدیر PIN ولیکئ");
if(pin==="2468"){
admin=true;
$("admin").classList.remove("hidden");
renderManage();
showStats();
}else{
alert("PIN ناسم دی");
}
}

function logout(){
admin=false;
$("admin").classList.add("hidden");
}

function addAd(){
if(!admin)return;

let title=$("title").value.trim();
let category=$("category").value;
let price=$("price").value.trim();
let city=$("city").value;
let details=$("details").value.trim();
let file=$("media").files[0];

if(!title||!category||!price||!city||!file){
alert("ټول اړین معلومات بشپړ کړئ");
return;
}

if(file.size>500000){
alert("فایل ډېر لوی دی. کوچنی عکس یا ویډیو وټاکئ.");
return;
}

let reader=new FileReader();

reader.onload=function(){
let ad={
id:editing||Date.now().toString(),
title,category,price,city,details,
media:reader.result,
type:file.type.startsWith("video")?"video":"image",
duration:Number($("duration").value),
repeat:$("repeat").checked,
created:editing?
(ads.find(a=>a.id===editing)?.created||Date.now()):
Date.now(),
views:editing?
(ads.find(a=>a.id===editing)?.views||0):0,
likes:editing?
(ads.find(a=>a.id===editing)?.likes||0):0
};

if(editing){
ads=ads.map(a=>a.id===editing?ad:a);
}else{
ads.unshift(ad);
}

try{
save();
clearForm();
showAds();
renderManage();
showStats();
alert("اعلان ثبت شو");
}catch(e){
alert("د حافظې ستونزه ده. کوچنی فایل وکاروئ.");
}
};

reader.onerror=()=>alert("فایل ونه لوستل شو");
reader.readAsDataURL(file);
}

function clearForm(){
["title","price","city","details","media"].forEach(id=>$(id).value="");
$("repeat").checked=false;
editing=null;
}

function showAds(){
let box=$("ads");
box.innerHTML="";
let q=$("search").value.trim().toLowerCase();
let f=$("filter").value;
let now=Date.now();

let list=ads.filter(a=>
(!f||a.category===f)&&
(a.title+" "+a.city+" "+a.details).toLowerCase().includes(q)&&
(now-a.created)<a.duration*3600000
);

if(!list.length){
box.innerHTML="<p>اوس مهال اعلان نشته.</p>";
return;
}

list.forEach(a=>{
let d=document.createElement("div");
d.className="card";

let h=document.createElement("h3");
h.textContent=a.title;
d.appendChild(h);

if(a.media){
let media;
if(a.type==="video"){
media=document.createElement("video");
media.controls=true;
media.playsInline=true;
}else{
media=document.createElement("img");
}
media.src=a.media;
d.appendChild(media);
}

let p=document.createElement("p");
p.textContent="کټګوري: "+a.category+
" | قیمت: "+a.price+" افغانۍ | ولایت: "+a.city;
d.appendChild(p);

let detail=document.createElement("p");
detail.textContent=a.details;
d.appendChild(detail);

let stats=document.createElement("p");
stats.className="muted";
stats.textContent="لیدنې: "+(a.views||0)+" | خوښې: "+(a.likes||0);
d.appendChild(stats);

let like=document.createElement("button");
like.textContent="❤️ خوښول";
like.onclick=()=>{
a.likes++;
save();
showAds();
showStats();
};
d.appendChild(like);

let contact=document.createElement("a");
contact.className="btn green";
contact.href="https://wa.me/93706022306";
contact.textContent="اړیکه";
d.appendChild(contact);

box.appendChild(d);
});
}

function renderManage(){
if(!admin)return;
let box=$("manage");
box.innerHTML="";

ads.forEach(a=>{
let d=document.createElement("div");
d.className="card";

let title=document.createElement("b");
title.textContent=a.title;
d.appendChild(title);

let edit=document.createElement("button");
edit.textContent="سمول";
edit.onclick=()=>{
editing=a.id;
$("title").value=a.title;
$("category").value=a.category;
$("price").value=a.price;
$("city").value=a.city;
$("details").value=a.details;
$("duration").value=a.duration;
$("repeat").checked=a.repeat;
alert("معلومات اصلاح کړئ او بیا اعلان خپور کړئ. که عکس بدلول نه غواړئ، نوی عکس وټاکئ.");
};
d.appendChild(edit);

let del=document.createElement("button");
del.className="red";
del.textContent="حذف";
del.onclick=()=>{
if(confirm("اعلان حذف کړئ؟")){
ads=ads.filter(x=>x.id!==a.id);
save();
showAds();
renderManage();
showStats();
}
};
d.appendChild(del);
box.appendChild(d);
});
}

function showStats(){
if(!admin)return;
let views=ads.reduce((s,a)=>s+(a.views||0),0);
let likes=ads.reduce((s,a)=>s+(a.likes||0),0);

$("stats").textContent=
"ټول اعلانونه: "+ads.length+
" | ټولې لیدنې: "+views+
" | ټولې خوښې: "+likes;
}

$("search").addEventListener("input",showAds);
$("filter").addEventListener("change",showAds);

setup();
load();
showAds();
</script>

</body>
</html>
